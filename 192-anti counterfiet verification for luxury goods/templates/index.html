<!DOCTYPE html>
<html>
<head>
    <title>Product Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 18rem;">
        <h3 class="text-center mb-4">Luxury Product Verification</h3>

        <p class="text-muted text-center">
            Scan the QR code on your product or enter the token manually below.
        </p>

        <form method="GET" action="/verify">
            <div class="mb-3">
                <input type="text" name="token" class="form-control" placeholder="Enter product token">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Verify Product</button>
            </div>
        </form>

        <hr>

        <div class="text-center">
            <a href="/login" class="btn btn-outline-dark btn-sm">Admin Login</a>
        </div>
    </div>
</div>

</body>
</html>
